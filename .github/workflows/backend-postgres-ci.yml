name: Backend PostgreSQL CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-postgres-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-postgres-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitopt
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gitopt"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gitopt
      JWT_SECRET: ci-only-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify migrated database
        run: |
          node --import tsx -e "import('./src/config/database.ts').then(async ({db,pgPool}) => { await db.init(); const stats = await db.getTableStats(); if (!stats.workload_profiles || !stats.users) throw new Error('Reference seed data missing'); const tables = await pgPool.query(\"SELECT to_regclass('public.scalar_enlistments') AS enlistments, to_regclass('public.scalar_operations') AS operations\"); if (!tables.rows[0].enlistments || !tables.rows[0].operations) throw new Error('Scalar migration tables missing'); console.log({stats, scalarTables: tables.rows[0]}); await pgPool.end(); })"


  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
